# =================================================================
# General Application & Server Settings
# =================================================================
spring.application.name=stationly-syncer
spring.threads.virtual.enabled=true
spring.main.web-application-type=none

# Logging
logging.level.com.stationly=INFO

# =================================================================
# TFL API & Polling Configuration
# =================================================================
# TFL API Configuration
# Override this using environment variable TFL_APP_KEY
tfl.app.key=${TFL_APP_KEY:default_key}

# TFL Polling Configuration
tfl.transport.modes=${TFL_TRANSPORT_MODES:tube,overground,dlr,bus,elizabeth-line}
tfl.polling.interval=${TFL_POLLING_INTERVAL:30000}
# How many predictions to fetch for arrivals -1 returns all
tfl.arrival.prediction.count=${TFL_ARRIVAL_PREDICTION_COUNT:-1}
tfl.api.timeout=${TFL_API_TIMEOUT:30}

# Strategy: 'all' to fetch everything blindly.
# 'subscribed' to only for the actively subscribed stations
tfl.polling.strategy=${TFL_POLLING_STRATEGY:subscribed}

# Departure-board (ArrivalDepartures) enrichment for Elizabeth line/Overground
# stations: real terminus departures + cancelled-train filtering in FCM
# payloads. 'enabled' is the ops kill switch (false = pure countdown, exact
# pre-board behavior); max-calls-per-cycle caps the per-cycle per-line board
# calls (termini planned first, the rest rotate under the cap).
tfl.arrival-departures.enabled=${TFL_ARRIVAL_DEPARTURES_ENABLED:true}
tfl.arrival-departures.max-calls-per-cycle=${TFL_ARRIVAL_DEPARTURES_MAX_CALLS_PER_CYCLE:60}

# Line Status Polling Configuration only for local development
tfl.status.polling.interval=${TFL_STATUS_POLLING_INTERVAL:10m}

# =================================================================
# Firebase (FCM & Firestore) Configuration
# =================================================================
# FCM Configuration (for push notifications)
# For local development: use file path
fcm.service-account-path=${FCM_SERVICE_ACCOUNT_PATH:/home/ubuntu/config/firebase-service-account.json}

# Firestore Configuration
# Credentials are reused from FCM configuration (fcm.service-account-path/json)
firestore.project-id=${FIRESTORE_PROJECT_ID:}


# =================================================================
# Maintenance & Sync Tasks
# =================================================================
# Station Sync Configuration
# Set to run at 2:00 AM on the first Monday of every month
station.sync.cron=${STATION_SYNC_CRON:0 0 2 ? * MON#1}

# =================================================================
# Local SQLite Cache Configuration
# =================================================================
sqlite.db-path=${SQLITE_DB_PATH:data/stationly-syncer.sqlite}

# =================================================================
# National Rail (Darwin) Module
# =================================================================
# Master kill switch. When false, none of the live components (Push Port
# listener, timetable/heartbeat/reference schedulers) are created — fully dark.
# Default OFF until Darwin credentials + backend/UI pre-work (see README) are done.
nationalrail.enabled=${NATIONALRAIL_ENABLED:false}

# Own SQLite mirror, isolated from the TfL cache. Baseline timetable + live deltas.
nationalrail.sqlite.db-path=${NATIONALRAIL_SQLITE_DB_PATH:data/stationly-nationalrail.sqlite}

# Full morning timetable sync (Europe/London). Reference TIPLOC↔CRS refreshes
# just before so ingest can resolve stations.
nationalrail.timetable.load-cron=${NATIONALRAIL_TIMETABLE_LOAD_CRON:0 0 3 * * *}
nationalrail.reference.refresh-cron=${NATIONALRAIL_REFERENCE_REFRESH_CRON:0 45 2 * * *}

# Max departures the board engine returns per station (app buffers, displays ~3).
nationalrail.board.max-departures=${NATIONALRAIL_BOARD_MAX_DEPARTURES:30}

# Coalesce a burst of drift triggers for one station into a single rebuild (ms).
nationalrail.debounce.window-ms=${NATIONALRAIL_DEBOUNCE_WINDOW_MS:4000}

# Safety-net freshness sweep (ms): bounds worst-case staleness + ages out
# departed trains on quiet stations. Doubles as the change detector's heartbeat
# window. Pure SQL — no external call.
nationalrail.heartbeat.interval-ms=${NATIONALRAIL_HEARTBEAT_INTERVAL_MS:900000}

# --- Darwin / Rail Data Marketplace credentials (all injected via env) -------
# Timetable feed — the daily rid-keyed schedule snapshot (SQL baseline).
darwin.timetable-feed-url=${DARWIN_TIMETABLE_FEED_URL:}
darwin.timetable-feed-username=${DARWIN_TIMETABLE_FEED_USERNAME:}
darwin.timetable-feed-password=${DARWIN_TIMETABLE_FEED_PASSWORD:}
# Darwin "Real Time Train Information" — RDM delivers this as a Kafka feed of
# JSON (Darwin v17), not legacy STOMP/XML. Five values from the product's
# Pub/Sub tab on raildata.org.uk.
darwin.kafka-bootstrap-servers=${DARWIN_KAFKA_BOOTSTRAP_SERVERS:}
darwin.kafka-consumer-key=${DARWIN_KAFKA_CONSUMER_KEY:}
darwin.kafka-consumer-secret=${DARWIN_KAFKA_CONSUMER_SECRET:}
darwin.kafka-group-id=${DARWIN_KAFKA_GROUP_ID:}
darwin.kafka-topic=${DARWIN_KAFKA_TOPIC:}
# Reference data — the TIPLOC↔CRS location table (+ station names).
darwin.reference-data-url=${DARWIN_REFERENCE_DATA_URL:}
darwin.reference-data-username=${DARWIN_REFERENCE_DATA_USERNAME:}
darwin.reference-data-password=${DARWIN_REFERENCE_DATA_PASSWORD:}
# OpenLDBWS — v2 reconciliation / re-anchor only (NOT on the v1 hot path).
darwin.ldbws-token=${DARWIN_LDBWS_TOKEN:}
darwin.ldbws-endpoint=${DARWIN_LDBWS_ENDPOINT:https://lite.realtime.nationalrail.co.uk/OpenLDBWS/ldb11.asmx}