# =================================================================
# General Application & Server Settings
# =================================================================
spring.application.name=stationly-syncer
spring.threads.virtual.enabled=true

# The Syncer is a headless worker; this enables a minimal reactive (Netty) HTTP
# server that ONLY serves the status endpoints (/health, /sync-status) consumed
# by stationly-admin. Bound to localhost by default — see server.address below.
spring.main.web-application-type=reactive
server.port=${SYNCER_STATUS_PORT:8081}
# Localhost-only by default (admin on the same VM hits 127.0.0.1:8081). For
# cross-VM access set SYNCER_STATUS_BIND=0.0.0.0 + syncer.status.key + an nginx route.
server.address=${SYNCER_STATUS_BIND:127.0.0.1}

# Logging
logging.level.com.stationly=INFO

# =================================================================
# TFL API & Polling Configuration
# =================================================================
# TFL API Configuration
# Override this using environment variable TFL_APP_KEY
tfl.app.key=${TFL_APP_KEY:default_key}

# TFL Polling Configuration
tfl.transport.modes=${TFL_TRANSPORT_MODES:tube,overground,dlr,bus,elizabeth-line}
tfl.polling.interval=${TFL_POLLING_INTERVAL:30000}
# How many predictions to fetch for arrivals -1 returns all
tfl.arrival.prediction.count=${TFL_ARRIVAL_PREDICTION_COUNT:-1}
tfl.api.timeout=${TFL_API_TIMEOUT:30}

# Strategy: 'all' to fetch everything blindly. 
# 'subscribed' to only for the actively subscribed stations
tfl.polling.strategy=${TFL_POLLING_STRATEGY:subscribed}

# Line Status Polling Configuration only for local development
tfl.status.polling.interval=${TFL_STATUS_POLLING_INTERVAL:10m}

# =================================================================
# Firebase (FCM & Firestore) Configuration
# =================================================================
# FCM Configuration (for push notifications)
# For local development: use file path
fcm.service-account-path=${FCM_SERVICE_ACCOUNT_PATH:/home/ubuntu/config/firebase-service-account.json}

# Firestore Configuration
# Credentials are reused from FCM configuration (fcm.service-account-path/json)
firestore.project-id=${FIRESTORE_PROJECT_ID:}


# =================================================================
# Maintenance & Sync Tasks
# =================================================================
# Station Sync Configuration
# Set to run at 2:00 AM on the first Monday of every month
station.sync.cron=${STATION_SYNC_CRON:0 0 2 ? * MON#1}

# =================================================================
# Local SQLite Cache Configuration
# =================================================================
sqlite.db-path=${SQLITE_DB_PATH:data/stationly-syncer.sqlite}

# =================================================================
# Sync Status Logging & Retention (powers /health + /sync-status)
# =================================================================
# Optional bearer key gating /sync-status* (Authorization: Bearer or X-Stationly-Key).
# /health stays open. Unset = open (acceptable for a localhost-only bind).
syncer.status.key=${SYNCER_STATUS_KEY:}

# Async writer: a full queue DROPS records (counted) rather than ever blocking a sync.
syncer.status.queue-capacity=${SYNCER_STATUS_QUEUE:2000}
syncer.status.write-batch=${SYNCER_STATUS_BATCH:200}

# Retention: raw per-run rows are kept this long, then rolled into hourly buckets;
# hourly buckets are kept then rolled into daily; daily buckets are kept then deleted.
syncer.status.raw-retention=${SYNCER_STATUS_RAW_RETENTION:24h}
syncer.status.hourly-retention=${SYNCER_STATUS_HOURLY_RETENTION:30d}
syncer.status.daily-retention=${SYNCER_STATUS_DAILY_RETENTION:365d}

# When the rollup/prune sweep runs (Spring cron). Default: 5 min past every hour.
syncer.status.rollup-cron=${SYNCER_STATUS_ROLLUP_CRON:0 5 * * * *}