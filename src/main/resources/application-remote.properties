# =================================================================
# Stationly Syncer - Remote Environment Overrides
# =================================================================

# TfL API Configuration
tfl.app.key=

# Firebase & Firestore Configuration
firestore.project-id=

# Shared secret for the Syncer -> backend live-stream ingest. Must match
# LIVESTREAM_INGEST_SECRET in the backend's env.
#
# MUST STAY BLANK — this file is git-tracked and is only a MANIFEST of key
# names. The deploy scripts read the keys and substitute values from
# STAGING_<KEY> env vars (staging_deploy.sh) or GitHub secrets (deploy-prod).
# A real value here would be committed to the repo; it is also ignored by the
# merge loop, so it buys nothing. A key ABSENT here is silently skipped, which
# is why the blank line itself matters.
#   export STAGING_LIVESTREAM_INGEST_SECRET=... before running the deploy.
livestream.ingest-secret=
